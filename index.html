<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock - Quillinzo</title>
    <!-- Tailwind CSS para diseño rápido y responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-emerald-800 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">📦 Control de Stock Quillinzo</h1>
        <div id="user-info" class="text-sm"></div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4">
        
        <!-- Login Section (Oculto si está logueado) -->
        <section id="auth-section" class="bg-white p-6 rounded-lg shadow max-w-md mx-auto mt-10">
            <h2 class="text-lg font-semibold mb-4 text-center">Iniciar Sesión</h2>
            <input type="email" id="email" placeholder="Correo electrónico" class="w-full p-2 border rounded mb-3">
            <input type="password" id="password" placeholder="Contraseña" class="w-full p-2 border rounded mb-4">
            <button onclick="handleLogin()" class="w-full bg-emerald-700 text-white p-2 rounded hover:bg-emerald-800 transition">Ingresar</button>
        </section>

        <!-- App Content (Oculto si no está logueado) -->
        <section id="app-section" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-700">Inventario Actual</h2>
                <button onclick="handleLogout()" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">Cerrar Sesión</button>
            </div>

            <!-- Listado de Stock -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-200 text-slate-700 uppercase text-xs">
                        <tr>
                            <th class="p-3">Artículo</th>
                            <th class="p-3">Categoría</th>
                            <th class="p-3">Cantidad</th>
                            <th class="p-3">Vencimiento</th>
                            <th class="p-3">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body" class="divide-y divide-slate-100 text-sm">
                        <!-- Los datos se cargan dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Script de lógica -->
    <script>
        // Configura tus credenciales de Supabase aquí
        const SUPABASE_URL = 'TU_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-info').innerText = session.user.email;
                loadInventory();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Error al iniciar sesión: ' + error.message);
            } else {
                checkUser();
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            checkUser();
        }

        async function loadInventory() {
            const { data, error } = await supabaseClient.from('items').select('*');
            const tbody = document.getElementById('inventory-table-body');
            tbody.innerHTML = '';
            
            if (error) {
                console.error('Error cargando inventario:', error);
                return;
            }

            data.forEach(item => {
                const row = `<tr class="hover:bg-slate-50">
                    <td class="p-3 font-medium">${item.nombre}</td>
                    <td class="p-3 text-slate-500">${item.categoria}</td>
                    <td class="p-3 font-bold">${item.cantidad}</td>
                    <td class="p-3 text-slate-500">${item.vencimiento || 'Sin fecha'}</td>
                    <td class="p-3">
                        <button onclick="updateStock('${item.id}', 1)" class="bg-emerald-100 text-emerald-800 px-2 py-1 rounded text-xs mr-1 font-bold">+</button>
                        <button onclick="updateStock('${item.id}', -1)" class="bg-amber-100 text-amber-800 px-2 py-1 rounded text-xs font-bold">-</button>
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        async function updateStock(id, change) {
            // Lógica rápida para sumar/restar stock
            const { data: current } = await supabaseClient.from('items').select('cantidad').eq('id', id).single();
            const nuevaCantidad = Math.max(0, current.cantidad + change);
            
            await supabaseClient.from('items').update({ cantidad: nuevaCantidad }).eq('id', id);
            loadInventory();
        }

        // Ejecutar verificación al cargar
        checkUser();
    </script>
</body>
</html>
